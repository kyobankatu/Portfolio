name: Portfolio CI and publish

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: portfolio-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        outputs:
            image-id: ${{ steps.image.outputs.id }}
        env:
            LOCAL_IMAGE: portfolio-ci:${{ github.sha }}
            PORTFOLIO_BASE_URL: http://127.0.0.1:4173
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Test portfolio data and rendered behavior
              run: npm run test:unit
            - name: Check directory indexes
              run: python3 -B tools/check_contents.py . --exclude .claude/settings.local.json --exclude test-results --exclude playwright-report
            - name: Test deployment controller
              run: python3 -B -m unittest discover -s tests/deploy -p 'test_*.py' -v
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Build production image
              run: docker build --pull --label org.opencontainers.image.source=https://github.com/kyobankatu/Portfolio --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$LOCAL_IMAGE" .
            - name: Check production runtime
              run: docker run --rm -i "$LOCAL_IMAGE" node --input-type=module < tools/check_runtime.mjs
            - name: Start production image
              run: docker run -d --name portfolio-e2e -p 127.0.0.1:4173:3000 "$LOCAL_IMAGE"
            - name: Browser E2E
              run: npm run test:e2e
            - name: Export verified master image
              id: image
              if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
              run: |
                  mkdir -p "$RUNNER_TEMP/portfolio-image"
                  docker save --output "$RUNNER_TEMP/portfolio-image/image.tar" "$LOCAL_IMAGE"
                  printf 'id=%s\n' "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
            - name: Upload verified image
              if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: portfolio-image-${{ github.sha }}
                  path: ${{ runner.temp }}/portfolio-image/image.tar
                  if-no-files-found: error
                  retention-days: 1
                  compression-level: 6
            - name: Show server log on failure
              if: failure()
              run: docker logs portfolio-e2e || true
            - name: Clean up
              if: always()
              run: docker rm -f portfolio-e2e || true

    publish:
        needs: verify
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        env:
            LOCAL_IMAGE: portfolio-ci:${{ github.sha }}
            IMAGE: ghcr.io/kyobankatu/portfolio
        steps:
            - name: Download verified image from this run
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: portfolio-image-${{ github.sha }}
                  path: ${{ runner.temp }}/portfolio-image
            - name: Load and verify image identity
              env:
                  EXPECTED_IMAGE_ID: ${{ needs.verify.outputs.image-id }}
              run: |
                  docker load --input "$RUNNER_TEMP/portfolio-image/image.tar"
                  test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
            - name: Publish verified master image
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
              run: |
                  printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                  docker tag "$LOCAL_IMAGE" "$IMAGE:sha-$GITHUB_SHA"
                  docker push "$IMAGE:sha-$GITHUB_SHA"
            - name: Log out of GHCR
              if: always()
              run: docker logout ghcr.io || true
